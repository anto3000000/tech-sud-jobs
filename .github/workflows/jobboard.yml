name: Job board — refresh & deploy

on:
  schedule:
    - cron: "17 5 * * *"      # ~07:17 Europe/Paris (summer) / 06:17 (winter), daily
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "Rebuild from committed data only (skip WTTJ/ATS/France Travail fetch, alerts, LinkedIn)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "jobboard/**"
      - ".github/workflows/jobboard.yml"

permissions:
  contents: write     # commit the refreshed feed back
  pages: write        # deploy to GitHub Pages
  id-token: write

concurrency:
  group: jobboard
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed to diff the pushed range in "Pick mode"

      - name: Pick mode (full refresh vs rebuild only)
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REBUILD: ${{ inputs.rebuild_only }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Full refresh (network fetch) is the default: cron, manual runs, and any push
          # touching fetchers / data / company lists. Rebuild-only is chosen when a push
          # changes nothing but rendering code, the site, or brand assets.
          mode=full
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_REBUILD" = "true" ]; then
            mode=rebuild
          elif [ "$EVENT" = "push" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            other=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" \
              | grep -v -E '^jobboard/(build|build_companies|render_pages|classify)\.py$|^jobboard/(site|brand)/' \
              || true)
            [ -z "$other" ] && mode=rebuild
          fi
          echo "mode=$mode" | tee -a "$GITHUB_OUTPUT"
          [ "$mode" = rebuild ] && echo "REBUILD_ONLY=1" >> "$GITHUB_ENV" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow (LinkedIn card rendering)
        run: pip install "Pillow==11.3.0"

      - name: Cache WTTJ detail responses
        uses: actions/cache@v4
        with:
          path: jobboard/data/cache
          key: wttj-cache-${{ github.run_id }}
          restore-keys: |
            wttj-cache-

      - name: Run pipeline
        env:
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          EMAILOCTOPUS_API_KEY: ${{ secrets.EMAILOCTOPUS_API_KEY }}
          EMAILOCTOPUS_LIST_ID: ${{ secrets.EMAILOCTOPUS_LIST_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: ./jobboard/pipeline.sh

      - name: Commit refreshed feed
        run: |
          git config user.name  "jobboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -u (not -A): stage every CHANGE to an already-tracked file under
          # jobboard/data/ or jobboard/site/ (whichever of the pipeline's
          # outputs actually moved — jobs.json, llms.txt, ...) without
          # picking up new untracked/gitignored build artefacts (the
          # generated offre/emploi/entreprise pages, sitemaps, etc. are
          # gitignored and deployed straight from disk, not committed).
          git add -u jobboard/data jobboard/site
          if git diff --cached --quiet; then
            echo "feed unchanged"
          else
            git commit -m "chore(jobboard): refresh feed $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: jobboard/site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Publish daily LinkedIn card
        # Runs after deploy so the card's image is actually live at
        # sudtechjobs.com/linkedin/<date>.png — Buffer fetches it by URL.
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        if: steps.mode.outputs.mode == 'full'
        run: python3 jobboard/linkedin_post.py --publish || echo "LinkedIn publish failed — continuing"

      - name: Persist LinkedIn publish state
        if: steps.mode.outputs.mode == 'full'
        # --publish only updates last_published_date in-memory on this
        # runner; the earlier "Commit refreshed feed" step ran before it,
        # so without this it would never reach git — and a second push
        # later the same day would publish again (no committed guard).
        run: |
          git config user.name  "jobboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobboard/data/linkedin_state.json
          if git diff --cached --quiet; then
            echo "linkedin state unchanged"
          else
            git commit -m "chore(jobboard): record LinkedIn publish $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin main
            git push
          fi
