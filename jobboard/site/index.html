<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sudtechjobs</title>
<meta name="description" content="Le job board tech du sud de la France — PACA d'abord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EDF2F6; --card:#FFFFFF; --card-2:#F4F8FB;
    --ink:#16303F; --muted:#5F7488; --line:#DCE4EC;
    --accent:#F2A63B; --accent-ink:#93600F; --on-accent:#3A2708;   /* ambre — l'anneau de la loupe */
    --brand:#7CBDE8; --brand-ink:#2C6C9E;                          /* bleu ciel de l'ecran / liens */
    --wash:#FBEBD6; --pine:#2C9A6B;
    --chip:#F4F8FB; --chip-on:#16303F;
    --tag-eng:#2C6C9E; --tag-data:#7B4BD8; --tag-product:#2C9A6B; --tag-design:#D6455D; --tag-adj:#8A6D1F;
    --shadow:0 1px 2px rgba(22,48,63,.05), 0 12px 28px -16px rgba(22,48,63,.18);
    --iris:
      radial-gradient(105% 70% at 96% -8%,  color-mix(in srgb,var(--accent) 22%,transparent) 0%, transparent 55%),
      radial-gradient(105% 80% at -8% -4%,  color-mix(in srgb,var(--brand) 46%,transparent) 0%, transparent 52%),
      radial-gradient(120% 55% at 50% 118%, color-mix(in srgb,var(--brand) 16%,transparent) 0%, transparent 60%);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0E1C27; --card:#162733; --card-2:#1C303D;
      --ink:#E4EDF3; --muted:#8DA2B2; --line:#263B49;
      --accent:#E7A24A; --accent-ink:#F1C089; --on-accent:#2A1B06;
      --brand:#7CBDE8; --brand-ink:#8CC6ED;
      --wash:#2A2013; --pine:#48B487;
      --chip:#1C303D; --chip-on:#E4EDF3;
      --tag-eng:#5B9BD8; --tag-data:#A98AE8; --tag-product:#48B487; --tag-design:#E8737F; --tag-adj:#C6A250;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 32px -18px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;color:var(--ink);min-height:100vh;
    font:15px/1.55 "Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--iris), var(--bg);
    background-attachment:fixed}
  a{color:var(--brand-ink);text-decoration:none}
  a:hover{text-decoration:underline}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px 90px}

  header{position:relative;padding:26px 0 16px}
  .brandline{display:flex;align-items:center;gap:13px}
  .brandline svg{flex:none;width:46px;height:46px;filter:drop-shadow(0 4px 10px rgba(22,48,63,.16))}
  .brandline .wm{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:25px;
    letter-spacing:-.02em;color:var(--ink);line-height:1}
  .brandline .wm i{color:var(--accent);font-style:normal}
  .brandline .rb{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
    color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 20%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:999px;
    padding:5px 10px;letter-spacing:.02em;white-space:nowrap}
  header h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:21px;line-height:1.35;
    margin:18px 0 0;max-width:46ch;letter-spacing:-.01em;text-wrap:balance}
  header h1 em{font-style:normal;color:var(--brand-ink)}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 2px;
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
  .stats b{color:var(--ink);font-weight:600}

  .controls{position:sticky;top:0;z-index:8;margin:0 -20px;padding:12px 20px 14px;
    background:var(--iris), color-mix(in srgb,var(--bg) 94%,transparent);
    background-attachment:fixed;backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line)}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row + .row{margin-top:10px}

  .search{display:flex;gap:10px;align-items:stretch}
  .search .box{flex:1;display:flex;align-items:center;gap:10px;min-width:0;
    background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:0 15px;
    box-shadow:var(--shadow)}
  .search .box:focus-within{border-color:var(--brand)}
  .search .box svg{flex:none;width:19px;height:19px;color:var(--muted)}
  .search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;
    color:var(--ink);padding:15px 0}
  .search button{flex:none;border:0;cursor:pointer;border-radius:13px;padding:0 26px;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;
    color:var(--on-accent);background:var(--accent);
    box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 75%,transparent)}
  .search button:hover{filter:brightness(1.05)}
  .search button:active{transform:translateY(1px)}

  .geo{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:1px}
  .geo::-webkit-scrollbar{display:none}
  .geo .chip{flex:none;white-space:nowrap}
  .chip .n{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.62;margin-left:6px}

  .chip{border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--brand);color:var(--brand-ink)}
  .chip[aria-pressed=true]{background:var(--card);color:var(--ink);border-color:var(--brand);
    box-shadow:inset 0 -2px 0 var(--brand)}
  .chip[data-new][aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
  select{appearance:none;font:inherit;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:9px;padding:7px 12px;cursor:pointer}
  select:focus{border-color:var(--brand);outline:none}

  .count{margin:20px 0 10px;font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:12.5px}
  .count b{color:var(--ink)}
  ul{list-style:none;margin:0;padding:0}
  li.job{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:12px;transition:border-color .12s ease,transform .12s ease}
  li.job:hover{border-color:var(--brand);transform:translateY(-1px)}
  .head{display:flex;gap:13px;align-items:flex-start}
  .logo{width:44px;height:44px;border-radius:11px;object-fit:contain;background:var(--card);
    border:1px solid var(--line);flex:none}
  .logo.ph{display:flex;align-items:center;justify-content:center;
    font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:17px;color:var(--brand-ink);
    background:color-mix(in srgb,var(--brand) 22%,transparent);
    border-color:color-mix(in srgb,var(--brand) 34%,transparent)}
  .head .t{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;font-weight:600;
    letter-spacing:-.01em;line-height:1.3}
  .head .t a{color:var(--ink)}
  .head .co{color:var(--muted);font-size:13px;margin-top:3px}
  .head .co b{color:var(--ink);font-weight:600}
  .desc{margin:10px 0 0;color:var(--muted);font-size:13px;white-space:pre-line;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
  li.job.open .desc{-webkit-line-clamp:unset}
  .stack{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
  .stack b{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:500;
    background:var(--card-2);color:var(--brand-ink);border:1px solid var(--line);
    border-radius:6px;padding:3px 7px}
  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;font-size:12px;color:var(--muted);align-items:center}
  .meta span{background:var(--card-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
  .meta .sal{color:var(--pine);border-color:color-mix(in srgb,var(--pine) 35%,transparent);
    background:color-mix(in srgb,var(--pine) 12%,transparent);font-weight:500}
  .meta .new{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 42%,transparent);
    background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600;font-family:"IBM Plex Mono",monospace}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;padding:3px 8px;border-radius:6px;color:#fff;border:0}
  .tag.eng{background:var(--tag-eng)} .tag.data{background:var(--tag-data)}
  .tag.product{background:var(--tag-product)} .tag.design{background:var(--tag-design)}
  .tag.tech-adjacent{background:var(--tag-adj)}
  .meta .src{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
    background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  .apply{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;
    color:var(--accent-ink);background:color-mix(in srgb,var(--accent) 16%,transparent);
    border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);border-radius:8px;padding:5px 10px}
  .apply:hover{text-decoration:none;background:color-mix(in srgb,var(--accent) 26%,transparent)}
  .empty{text-align:center;color:var(--muted);padding:60px 0}
  footer{margin-top:44px;padding-top:22px;border-top:1px solid var(--line);
    color:var(--muted);font-size:12px;text-align:center;line-height:1.7}
  .load{padding:60px 0;text-align:center;color:var(--muted)}
  @media (max-width:520px){
    .search{flex-wrap:wrap}
    .search button{flex:1;padding:13px 0}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandline">
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect x="5" y="8" width="42" height="34" rx="8" fill="var(--brand)" stroke="var(--ink)" stroke-width="3.5"/>
        <path d="M22 42v6M14 50h16" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="20" cy="24" r="2.6" fill="var(--ink)"/><circle cx="32" cy="24" r="2.6" fill="var(--ink)"/>
        <path d="M20 31c2.4 2.6 7.6 2.6 10 0" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="44" cy="40" r="12" fill="var(--wash)" stroke="var(--accent)" stroke-width="4.5"/>
        <path d="M53 49l7 7" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <span class="wm">sudtechjobs<i>.</i></span>
      <span class="rb">RÉGION · PACA</span>
    </div>
    <h1>Les offres <em>dev, data, produit &amp; design</em> des boîtes tech du sud. De Marseille à Sophia-Antipolis, sans passer par Paris.</h1>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <form class="search" id="searchForm" role="search">
      <div class="box">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="search" id="q" placeholder="Poste, techno (React, Kubernetes…), entreprise" autocomplete="off">
      </div>
      <button type="submit">Chercher</button>
    </form>
    <div class="row geo" id="geo"></div>
    <div class="row" id="cats">
      <span class="chip" data-all="1" aria-pressed="true">Tout</span>
      <span class="chip" data-new="1" aria-pressed="false">✨ Nouvelles</span>
      <span class="chip" data-cat="eng" aria-pressed="false">Dev / Infra</span>
      <span class="chip" data-cat="data" aria-pressed="false">Data / IA</span>
      <span class="chip" data-cat="product" aria-pressed="false">Product</span>
      <span class="chip" data-cat="design" aria-pressed="false">Design</span>
      <span class="chip" data-cat="tech-adjacent" aria-pressed="false">IT &amp; autres</span>
      <span class="chip" data-remote="1" aria-pressed="false">Télétravail</span>
      <select id="stackSel"><option value="">Toute techno</option></select>
      <select id="contract"><option value="">Tous contrats</option></select>
      <select id="sort">
        <option value="date">Plus récentes</option>
        <option value="company">Par entreprise</option>
      </select>
    </div>
  </div>

  <div class="count" id="count"></div>
  <ul id="list"></ul>
  <div class="load" id="load">Chargement des offres…</div>
  <div class="empty" id="empty" hidden>Aucune offre ne correspond à ces filtres.</div>

  <footer id="foot"></footer>
</div>

<script>
const state = {q:"", city:"", stack:"", contract:"", sort:"date", cats:new Set(), remote:false, onlyNew:false};
let JOBS = [];
const $ = s => document.querySelector(s);
const norm = s => (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catLabel = c => ({eng:"Dev",data:"Data",product:"Product",design:"Design","tech-adjacent":"IT"}[c]||c||"–");

function relDate(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const mins = Math.floor((Date.now()-d)/60000);
  if(mins < 2) return "à l'instant";
  if(mins < 60) return `il y a ${mins} min`;
  const h = Math.floor(mins/60);
  if(h < 24) return `il y a ${h} h`;
  const days = Math.floor(h/24);
  if(days === 1) return "hier";
  if(days < 7) return `il y a ${days} j`;
  if(days < 31) return `il y a ${Math.floor(days/7)} sem`;
  if(days < 365) return `il y a ${Math.floor(days/30)} mois`;
  return `il y a ${Math.floor(days/365)} an(s)`;
}

function haystack(j){
  return norm([j.title,j.company,j.city,(j.cities||[]).join(" "),j.profession,j.contract,
    (j.stack||[]).join(" "),j.description_excerpt,j.profile_excerpt].join(" "));
}

function apply(){
  const q = norm(state.q).split(/\s+/).filter(Boolean);
  let rows = JOBS.filter(j=>{
    if(state.onlyNew && !j.is_new) return false;
    if(state.cats.size && !state.cats.has(j.category)) return false;
    if(state.city && (j.city||"")!==state.city && !(j.cities||[]).includes(state.city)) return false;
    if(state.stack && !(j.stack||[]).some(s=>norm(s)===norm(state.stack))) return false;
    if(state.contract && (j.contract||"")!==state.contract) return false;
    if(state.remote){
      const r = norm([j.remote_detail,j.remote].join(" "));
      if(!/remote|hybride|t.l.travail|ponctuel/.test(r)) return false;
    }
    if(q.length){ const h = haystack(j); if(!q.every(w=>h.includes(w))) return false; }
    return true;
  });
  rows.sort(state.sort==="company"
    ? (a,b)=> (a.company||"").localeCompare(b.company||"") || (b.published_at||"").localeCompare(a.published_at||"")
    : (a,b)=> (b.published_at||"").localeCompare(a.published_at||""));

  $("#count").textContent = `${rows.length} offre${rows.length>1?"s":""}`;
  $("#empty").hidden = rows.length>0;
  const frag = document.createDocumentFragment();
  for(const j of rows.slice(0,500)){
    const li = document.createElement("li"); li.className = "job";
    const cat = j.category||"";
    const rem = j.remote_detail || (j.remote && !/sur site/i.test(j.remote) ? j.remote : "");
    const logo = j.logo
      ? `<img class="logo" loading="lazy" src="${esc(j.logo)}" alt="">`
      : `<div class="logo ph">${esc((j.company||"?").slice(0,1))}</div>`;
    li.innerHTML = `
      <div class="head">
        ${logo}
        <div>
          <div class="t"><a href="${esc(j.url||j.apply_url||"#")}" target="_blank" rel="noopener">${esc(j.title)}</a></div>
          <div class="co"><b>${esc(j.company)}</b>${j.city?` · ${esc(j.city)}`:""}</div>
        </div>
        ${j.apply_url?`<a class="apply" href="${esc(j.apply_url)}" target="_blank" rel="noopener">Postuler en direct →</a>`:""}
      </div>
      ${j.description_excerpt?`<p class="desc">${esc(j.description_excerpt)}</p>`:""}
      ${(j.stack&&j.stack.length)?`<div class="stack">${j.stack.slice(0,12).map(s=>`<b>${esc(s)}</b>`).join("")}</div>`:""}
      <div class="meta">
        <span class="tag ${cat}">${catLabel(cat)}</span>
        ${j.is_new?`<span class="new">✨ nouveau</span>`:""}
        ${j.contract?`<span>${esc(j.contract)}</span>`:""}
        ${rem?`<span>${esc(rem)}</span>`:""}
        ${j.experience?`<span>${esc(j.experience)}</span>`:""}
        ${j.salary?`<span class="sal">${esc(j.salary)}</span>`:""}
        ${j.benefits_count?`<span>${j.benefits_count} avantages</span>`:""}
        ${j.published_at?`<span>${relDate(j.published_at)}</span>`:""}
        <span class="src">${esc(j.source)}</span>
      </div>`;
    if(j.description_excerpt){
      li.querySelector(".desc").addEventListener("click",()=>li.classList.toggle("open"));
    }
    frag.appendChild(li);
  }
  const list = $("#list"); list.innerHTML = ""; list.appendChild(frag);
}

function syncCats(){
  for(const chip of $("#cats").querySelectorAll(".chip")){
    let on;
    if(chip.dataset.all) on = state.cats.size===0 && !state.onlyNew && !state.remote;
    else if(chip.dataset.remote) on = state.remote;
    else if(chip.dataset.new) on = state.onlyNew;
    else on = state.cats.has(chip.dataset.cat);
    chip.setAttribute("aria-pressed", String(on));
  }
}

function buildGeo(){
  const cnt = {};
  for(const j of JOBS){ const c = j.city; if(c && c!=="Remote") cnt[c] = (cnt[c]||0)+1; }
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const geo = $("#geo");
  geo.innerHTML =
    `<span class="chip" data-city="" aria-pressed="true">Toute la région<span class="n">${JOBS.length}</span></span>` +
    top.map(([c,n])=>`<span class="chip" data-city="${esc(c)}" aria-pressed="false">${esc(c)}<span class="n">${n}</span></span>`).join("");
  geo.addEventListener("click", e=>{
    const chip = e.target.closest(".chip"); if(!chip) return;
    state.city = chip.dataset.city || "";
    for(const c of geo.children) c.setAttribute("aria-pressed", String(c===chip));
    apply();
  });
}

function initFilters(){
  buildGeo();

  const tools = {};
  for(const j of JOBS) for(const s of (j.stack||[])) tools[s]=(tools[s]||0)+1;
  for(const [t] of Object.entries(tools).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1])){
    const o=document.createElement("option"); o.value=o.textContent=t; $("#stackSel").appendChild(o);
  }
  const contracts = [...new Set(JOBS.map(j=>j.contract).filter(Boolean))].sort();
  for(const c of contracts){ const o=document.createElement("option"); o.value=o.textContent=c; $("#contract").appendChild(o); }

  $("#q").addEventListener("input", e=>{ state.q=e.target.value; apply(); });
  $("#searchForm").addEventListener("submit", e=>{
    e.preventDefault(); apply();
    $("#list").scrollIntoView({behavior:"smooth", block:"start"});
  });
  $("#stackSel").addEventListener("change", e=>{ state.stack=e.target.value; apply(); });
  $("#contract").addEventListener("change", e=>{ state.contract=e.target.value; apply(); });
  $("#sort").addEventListener("change", e=>{ state.sort=e.target.value; apply(); });
  $("#cats").addEventListener("click", e=>{
    const chip = e.target.closest(".chip"); if(!chip) return;
    if(chip.dataset.all){ state.cats.clear(); state.onlyNew=false; state.remote=false; }
    else {
      const on = chip.getAttribute("aria-pressed")==="true";
      if(chip.dataset.remote) state.remote = !on;
      else if(chip.dataset.new) state.onlyNew = !on;
      else { const c=chip.dataset.cat; on?state.cats.delete(c):state.cats.add(c); }
    }
    syncCats();
    apply();
  });
  syncCats();
}

fetch("jobs.json",{cache:"no-store"}).then(r=>r.json()).then(feed=>{
  JOBS = feed.jobs||[];
  $("#load").hidden = true;
  const bc = feed.by_category||{};
  const stacked = JOBS.filter(j=>j.stack&&j.stack.length).length;
  $("#stats").innerHTML =
    `<span><b>${feed.count}</b> offres</span>`+
    `<span><b>${feed.companies}</b> entreprises</span>`+
    `<span><b>${bc.eng||0}</b> dev · <b>${bc.data||0}</b> data · <b>${bc.product||0}</b> product · <b>${bc.design||0}</b> design</span>`+
    (feed.new_count?`<span><b>${feed.new_count}</b> nouvelles</span>`:"")+
    `<span>maj ${relDate(feed.generated_at)}</span>`;
  const d = new Date(feed.generated_at);
  $("#foot").innerHTML = `Données agrégées le ${isNaN(d)?feed.generated_at:d.toLocaleDateString("fr-FR")} · `+
    `sources : Welcome to the Jungle + ATS (Ashby, Lever, SmartRecruiters, Taleez, Recruitee, Workable)`;
  initFilters();
  apply();
}).catch(err=>{
  $("#load").textContent = "Impossible de charger jobs.json — lancez `python3 jobboard/build.py` puis servez ce dossier.";
  console.error(err);
});
</script>
</body>
</html>
